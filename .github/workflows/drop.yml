name: Daily drop

on:
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: drop
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp
          yt-dlp --version
      - name: Build today's drop
        env:
          CLIPDROP_RUNNER: cloud
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node clipdrop.mjs
      - name: Drop old clips
        run: find docs/clips -name '*.mp4' -type f -mtime +2 -delete || true
      - name: Publish
        run: |
          git config user.name "clipdrop"
          git config user.email "clipdrop@users.noreply.github.com"
          git add docs
          git diff --staged --quiet && echo "nothing new" && exit 0
          git commit -m "drop: $(date -u +%Y-%m-%d)"
          git push
      - name: Deploy page
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publish:
    needs: drop
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
