name: Posting reminders

# Once a day, books today's "time to post" alerts on ntfy for the exact posting
# times (ntfy delivers them at the time given), so a late-starting GitHub job
# can't make a reminder late. Times are UK clock times. Slots come from the
# clips themselves (a week pack labels each clip with its day and time);
# a plain daily drop uses 12:00, 17:00 and 22:00.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, sparse-checkout: 'campaigns/state.json
            remind.mjs' }
      - run: node remind.mjs
