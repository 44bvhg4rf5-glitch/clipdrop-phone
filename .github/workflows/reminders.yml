name: Posting reminders

# Once a day, books TOMORROW's alerts on ntfy for exact UK times (ntfy delivers
# each at the time given): the 5am "today's plan" and a "Posted: submit on
# Vyro" two minutes after each slot. Booking a day ahead means a late-starting
# GitHub job can never make an alert late. See remind.mjs.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'tomorrow (normal) or today (catch-up)'
        type: string
        default: 'tomorrow'

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: mkdir -p reminders && node remind.mjs
        env:
          DAY: ${{ inputs.day }}
      - name: Remember what was booked
        run: |
          git config user.name "clipdrop"; git config user.email "clipdrop@users.noreply.github.com"
          git add reminders/booked.json; git diff --staged --quiet && exit 0
          git commit -q -m "reminders: booked"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q && break; sleep $((i*2)); done
